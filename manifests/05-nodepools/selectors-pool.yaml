apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: selectors-demo
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        # need 3+ families per launch
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c5a", "c6a", "c6i", "m6a", "m6i", "r6a"]
          minValues: 3
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-south-1a", "ap-south-1b"]
      expireAfter: 720h
  limits:
    cpu: "4"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
