apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: team-batch
spec:
  template:
    metadata:
      labels:
        team: batch
      annotations:
        example.com/owner: batch-team
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      # only tolerating pods land here
      taints:
        - key: team
          value: batch
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2"]
      expireAfter: 720h
  limits:
    # headroom so taint check shows
    cpu: "4"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
