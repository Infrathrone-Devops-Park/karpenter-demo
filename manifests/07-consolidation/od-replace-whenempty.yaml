apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: od-replace
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # on-demand: replace always allowed
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4"]
      expireAfter: 720h
  limits:
    # 4 old + 2 replacement
    cpu: "6"
  disruption:
    # only empty nodes are removed
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
