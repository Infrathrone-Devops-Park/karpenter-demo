# Reference only: server dry-run
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: budget-schedule-example
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4"]
  limits:
    cpu: "4"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      # empty nodes: all at once
      - nodes: "100%"
        reasons: ["Empty"]
      # otherwise one node at a time
      - nodes: "1"
        reasons: ["Underutilized", "Drifted"]
      # weekdays 09:00-17:00 IST: frozen
      - nodes: "0"
        reasons: ["Underutilized", "Drifted"]
        schedule: "30 3 * * mon-fri"
        duration: 8h
