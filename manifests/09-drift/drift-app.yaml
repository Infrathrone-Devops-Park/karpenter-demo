apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-app
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drift-app
  template:
    metadata:
      labels:
        app: drift-app
    spec:
      terminationGracePeriodSeconds: 0
      nodeSelector:
        karpenter.sh/nodepool: default
      # one pod per node: 2 nodes
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: drift-app
      containers:
        - name: app
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.7
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
