apiVersion: apps/v1
kind: Deployment
metadata:
  name: spot-demo
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spot-demo
  template:
    metadata:
      labels:
        app: spot-demo
    spec:
      terminationGracePeriodSeconds: 0
      # pin to spot capacity
      nodeSelector:
        karpenter.sh/capacity-type: spot
        karpenter.sh/nodepool: default
      containers:
        - name: pause
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.7
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
