apiVersion: apps/v1
kind: Deployment
metadata:
  name: br-demo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: br-demo
  template:
    metadata:
      labels:
        app: br-demo
    spec:
      terminationGracePeriodSeconds: 0
      nodeSelector:
        karpenter.sh/nodepool: bottlerocket
      containers:
        - name: pause
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.7
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
