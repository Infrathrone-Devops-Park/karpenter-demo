apiVersion: apps/v1
kind: Deployment
metadata:
  name: overlay-demo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: overlay-demo
  template:
    metadata:
      labels:
        app: overlay-demo
    spec:
      terminationGracePeriodSeconds: 0
      nodeSelector:
        karpenter.sh/capacity-type: on-demand
        karpenter.sh/nodepool: default
      containers:
        - name: pause
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.7
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
