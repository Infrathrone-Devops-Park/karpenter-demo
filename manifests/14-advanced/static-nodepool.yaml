apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: static-demo
spec:
  # static mode; needs StaticCapacity gate
  replicas: 1
  template:
    metadata:
      labels:
        demo/pool: static
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
  limits:
    # static pools allow only nodes
    nodes: 1
