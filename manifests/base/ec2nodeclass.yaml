apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: karpenter-demo-karpenter-node
  amiSelectorTerms:
    # pinned; drift demo moves it forward
    - alias: al2023@v20260930
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: karpenter-demo
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: karpenter-demo
  kubelet:
    # prefix delegation is on
    maxPods: 110
  tags:
    Project: karpenter-demo
